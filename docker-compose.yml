version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: syrus_postgres
    environment:
      POSTGRES_DB: syrus
      POSTGRES_USER: syrus
      POSTGRES_PASSWORD: syrus_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syrus"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: syrus_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mock-api:
    build:
      context: ./mock-api
      dockerfile: Dockerfile
    container_name: syrus_mock_api
    ports:
      - "8001:8001"
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./mock-api:/app

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: syrus_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://syrus:syrus_secret@postgres:5432/syrus
      - REDIS_URL=redis://redis:6379
      - MOCK_API_URL=http://mock-api:8001
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - APPROVAL_TOKEN_SECRET=${APPROVAL_TOKEN_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-api:
        condition: service_started
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: syrus_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
